# Gradle JVM memory — prevent GC thrashing on first build.
# 4 GB heap + 1 GB Metaspace is comfortable for a Flutter project with many plugins.
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Run Gradle tasks in parallel where possible.
org.gradle.parallel=true

# Keep the Gradle daemon alive between builds for faster incremental builds.
org.gradle.daemon=true

# Use the configuration cache for faster builds (experimental but stable in Gradle 8+).
# org.gradle.configuration-cache=true

# Android-specific
android.useAndroidX=true
android.enableJetifier=true
